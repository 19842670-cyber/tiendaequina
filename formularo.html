<section class="container py-5" id="contacto">
    <div class="formulario-discord">
        <h2>📩 Contacta con EquiSports,  7651 5361.</h2>
        <p>Envíanos tu mensaje y lo recibiremos a discord solo busca tu producto describelo en tu mensaje y te enviaremos el pedido.</p>

        <form id="formDiscord">
            <label for="nombre">Tu nombre</label>
            <input type="text" id="nombre" class="form-control mb-3"
                placeholder="Escribe tu nombre" required>

            <label for="correo">Tu correo</label>
            <input type="email" id="correo" class="form-control mb-3"
                placeholder="correo@ejemplo.com" required>

            <label for="mensaje">Tu mensaje sobre lo que buscas comprar</label>
            <textarea id="mensaje" class="form-control mb-3"
                placeholder="Escribe tu mensaje" rows="4" required></textarea>

            <button type="submit" class="btn btn-equi" id="enviarDiscord">
                Enviar a Discord
            </button>

            <p id="estadoDiscord" class="mt-3" aria-live="polite"></p>
        </form>
    </div>
</section>

<script>
 const URL_WEBHOOK_DISCORD = "https://discord.com/api/webhooks/1559281470080819203/8P0sTyg6Gg2kgyAS3W_nHPSXom25ByNreUrfeAbqssNtHIlbGVbI9Yioq-dviXIBi12Z";

const formularioDiscord = document.getElementById("formDiscord");

if (formularioDiscord) {
    formularioDiscord.addEventListener("submit", async function(evento) {
        evento.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const mensaje = document.getElementById("mensaje").value.trim();
        const estado = document.getElementById("estadoDiscord");
        const boton = document.getElementById("enviarDiscord");

        if (!nombre || !correo || !mensaje) {
            estado.textContent = "Completa todos los campos.";
            return;
        }

        if (URL_WEBHOOK_DISCORD === "PEGA_AQUI_TU_URL_DEL_WEBHOOK") {
            estado.textContent = "Primero configura la URL del webhook.";
            return;
        }

        boton.disabled = true;
        estado.textContent = "Enviando mensaje...";

        try {
            const respuesta = await fetch(URL_WEBHOOK_DISCORD, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    embeds: [{
                        title: "🐎 Nuevo mensaje de EquiSports",
                        color: 12950875,
                        fields: [
                            { name: "Nombre", value: nombre.slice(0, 200) },
                            { name: "Correo", value: correo.slice(0, 200) },
                            { name: "Mensaje", value: mensaje.slice(0, 1000) }
                        ],
                        footer: { text: "Formulario de EquiSports" }
                    }]
                })
            });

            if (!respuesta.ok) {
                throw new Error("Discord rechazó el mensaje.");
            }

            estado.textContent = "✅ ¡Mensaje enviado a Discord!";
            formularioDiscord.reset();

        } catch (error) {
            estado.textContent =
                "❌ No se pudo enviar. Revisa la URL y la conexión.";
        } finally {
            boton.disabled = false;
        }
    });
}
</script>
